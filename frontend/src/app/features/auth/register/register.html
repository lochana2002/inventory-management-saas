
<div class="auth-container">
  <div class="auth-card">

    <div class="brand">
      <h1>StockFlow</h1>
      <p>Inventory Management System</p>
    </div>

    <h2>Create your account</h2>
    <p class="subtitle">Start managing your inventory today.</p>

    <div class="success-message" *ngIf="successMessage">
  {{ successMessage }}
</div>

<div class="error-message" *ngIf="errorMessage">
  {{ errorMessage }}
</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName"
          placeholder="Enter your full name">

        <small *ngIf="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.invalid">
          Full name is required.
        </small>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email"
          placeholder="Enter your email">

        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password"
          placeholder="Create a password">

        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must contain at least 8 characters.
        </small>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword"
          placeholder="Confirm your password">

        <small *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid">
          Please confirm your password.
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
  {{ isLoading ? 'Creating Account...' : 'Create Account' }}
</button>

    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
